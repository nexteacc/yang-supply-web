# Submits production URLs to IndexNow after a main-branch deploy is actually
# serving the key file. Pull requests do not run this workflow.
name: IndexNow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: indexnow-production
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the deployed commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test IndexNow submission guards
        run: node --test scripts/indexnow.test.mjs

      - name: Restore the previous production URL list
        uses: actions/cache@v4
        with:
          path: .indexnow/previous-urls.txt
          key: indexnow-urls-${{ github.run_id }}
          restore-keys: |
            indexnow-urls-

      - name: Submit production sitemap URLs
        run: node scripts/indexnow.mjs --sitemap --previous .indexnow/previous-urls.txt --save-previous .indexnow/previous-urls.txt
